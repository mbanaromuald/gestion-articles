stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:latest

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - devops-branch

deploy:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker run -d -p 3000:3000 $DOCKER_IMAGE
  only:
    - devops-branch
