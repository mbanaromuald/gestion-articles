name: CI/CD Pipeline

on:
  push:
    branches:
      - devops-branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/gestion-articles:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run container
        run: |
          docker run -d -p 3000:3000 ghcr.io/${{ github.repository }}/gestion-articles:latest
